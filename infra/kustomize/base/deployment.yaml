apiVersion: apps/v1
kind: Deployment
metadata:
  name: sandboxkit
  namespace: sandboxes
  labels:
    app: sandboxkit
spec:
  replicas: 1
  selector:
    matchLabels:
      app: sandboxkit
  template:
    metadata:
      labels:
        app: sandboxkit
    spec:
      serviceAccountName: sandboxkit
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: sandboxkit
          # Full ref set by `make infra`: $(DOCKERHUB_USER)/sandboxkit:$(IMAGE_TAG)
          image: sandboxkit:latest
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8000
              protocol: TCP
          env:
            - name: SANDBOX_NAMESPACE
              valueFrom:
                fieldRef:
                  fieldPath: metadata.namespace
            - name: JOB_TIMEOUT_SECONDS
              value: "60"
            - name: TEMPLATE_PY_IMAGE
              value: "sandboxkit-py-template:latest"
            - name: TEMPLATE_JS_IMAGE
              value: "sandbox-js-template:latest"
            - name: SANDBOX_IMAGE_PULL_POLICY
              value: "IfNotPresent"
          resources:
            requests:
              cpu: "100m"
              memory: "128Mi"
            limits:
              cpu: "500m"
              memory: "256Mi"
          readinessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 15
            periodSeconds: 20
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
